services:
  db:
    image: postgis/postgis:16-3.4
    container_name: envirolens-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-envirolens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-envirolens}
      POSTGRES_DB: ${POSTGRES_DB:-envirolens}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/seed/init_postgis.sql:/docker-entrypoint-initdb.d/01_postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-envirolens} -d ${POSTGRES_DB:-envirolens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: envirolens-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: envirolens-api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-envirolens}:${POSTGRES_PASSWORD:-envirolens}@db:5432/${POSTGRES_DB:-envirolens}
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY:-dev-api-key-change-me}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./synthetic_data:/app/synthetic_data:ro
      - ./metadata:/app/metadata:ro
      - ./geospatial:/app/geospatial
      - ./reports:/app/reports

volumes:
  pgdata:
